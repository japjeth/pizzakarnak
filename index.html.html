                        <h4 className="text-base sm:text-lg font-bold text-karnak-dark font-sans flex flex-wrap items-center gap-2 leading-tight">
                            {name}
                            {highlighted && <span className="text-[10px] sm:text-xs bg-karnak-gold text-white px-2 py-0.5 rounded-full">Trovato</span>}
                        </h4>
                        {ingredients && (
                            <p className="text-xs sm:text-sm text-gray-600 mt-1 font-sans italic leading-relaxed">
                                {ingredients}
                            </p>
                        )}
                    </div>
                </div>
                <div className="flex-shrink-0 ml-2 mt-0.5">
                    <span className="text-base sm:text-xl font-bold text-karnak-blue font-serif tracking-wide whitespace-nowrap">{price}€</span>
                </div>
            </div>
        );

        const App = () => {
            const [searchQuery, setSearchQuery] = useState("");

            // Filter logic
            const filteredMainPizze = useMemo(() => {
                if (!searchQuery) return data.mainPizze;
                const lowerQuery = searchQuery.toLowerCase();
                return data.mainPizze.filter(item => 
                    item.name.toLowerCase().includes(lowerQuery) || 
                    (item.ingredients && item.ingredients.toLowerCase().includes(lowerQuery)) ||
                    item.id.toString() === lowerQuery
                );
            }, [searchQuery]);

            const hasSearchResults = filteredMainPizze.length > 0;
            const isSearching = searchQuery.length > 0;

            return (
                <div className="min-h-screen pb-20">
                    <Header />
                    <PromoSection />

                    <main className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
                        
                        {/* Search Bar */}
                        <div className="sticky top-4 z-40 mb-10 shadow-lg rounded-full border border-gray-200 bg-white/90 backdrop-blur-md">
                            <div className="relative flex items-center">
                                <div className="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-karnak-red">
                                    <Icons.Search />
                                </div>
                                <input
                                    type="text"
                                    placeholder="Cerca per nome, numero o ingrediente..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-14 pr-6 py-4 bg-transparent focus:outline-none text-gray-700 font-sans text-lg rounded-full placeholder-gray-400"
                                />
                                {isSearching && (
                                    <button 
                                        onClick={() => setSearchQuery("")}
                                        className="absolute inset-y-0 right-0 pr-5 flex items-center text-gray-400 hover:text-karnak-red transition-colors font-bold"
                                    >
                                        ✕
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Menu Layout */}
                        <div className="bg-white rounded-3xl shadow-xl overflow-hidden border border-[#e5d9c5]">
                            
                            {/* Decorative Top Border */}
                            <div className="h-3 w-full bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PHBhdGggZD0iTTAgMGgyMHYyMEgwem0xMCAxMGwtNS01aDEwbC01IDV6IiBmaWxsPSIjOGIwMDAwIi8+PC9zdmc+')] opacity-20"></div>

                            <div className="p-6 md:p-10">
                                
                                {/* Section: Le Nostre Pizze (1-63) */}
                                <div className="mb-16">
                                    <div className="text-center mb-8 relative">
                                        <h2 className="text-4xl font-serif font-bold text-karnak-dark inline-block px-8 bg-white relative z-10">LE NOSTRE PIZZE</h2>
                                        <div className="absolute top-1/2 left-0 right-0 h-px bg-[#e5d9c5] -z-0"></div>
                                    </div>
                                    
                                    {hasSearchResults ? (
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-2">
                                            {filteredMainPizze.map(item => (
                                                <MenuItem key={item.id} {...item} highlighted={isSearching} />
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="text-center py-10 text-gray-500 font-sans">
                                            Nessuna pizza trovata per "{searchQuery}".
                                        </div>
                                    )}
                                </div>
                                
                                {!isSearching && (
                                    <>
                                        <PizzaDivider imageUrl="https://images.unsplash.com/photo-1590947132387-155cc02f3212?q=80&w=1200&auto=format&fit=crop" />

                                        {/* Grid for smaller sections */}
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                            
                                            {/* Calzoni */}
                                            <div>
                                                <div className="flex items-center gap-4 mb-6">
                                                    <div className="flex-1 h-px bg-[#e5d9c5]"></div>
                                                    <h2 className="text-3xl font-serif font-bold text-karnak-red">CALZONI</h2>
                                                    <div className="flex-1 h-px bg-[#e5d9c5]"></div>
                                                </div>
                                                <div className="flex flex-col gap-2">
                                                    {data.calzoni.map((item, idx) => (
                                                        <MenuItem key={idx} {...item} />
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Focacce */}
                                            <div>
                                                <div className="flex items-center gap-4 mb-6">
                                                    <div className="flex-1 h-px bg-[#e5d9c5]"></div>
                                                    <h2 className="text-3xl font-serif font-bold text-karnak-red">FOCACCE</h2>
                                                    <div className="flex-1 h-px bg-[#e5d9c5]"></div>
                                                </div>
                                                <div className="flex flex-col gap-2">
                                                    {data.focacce.map((item, idx) => (
                                                        <MenuItem key={idx} {...item} />
                                                    ))}
                                                </div>
                                                <p className="text-center mt-4 font-serif italic text-karnak-gold font-bold">~ Abbiamo tutti i tipi di focaccia. ~</p>
                                            </div>

                                            {/* Teglia Famiglia */}
                                            <div>
                                                <div className="flex items-center gap-4 mb-6">
                                                    <div className="flex-1 h-px bg-[#e5d9c5]"></div>
                                                    <h2 className="text-3xl font-serif font-bold text-karnak-red text-center">TEGLIA FAMIGLIA</h2>
                                                    <div className="flex-1 h-px bg-[#e5d9c5]"></div>
                                                </div>
                                                <div className="flex flex-col gap-2">
                                                    {data.tegliaFamiglia.map((item, idx) => (
                                                        <MenuItem key={idx} {...item} />
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Sfiziosità */}
                                            <div>
                                                <div className="flex items-center gap-4 mb-6">
                                                    <div className="flex-1 h-px bg-[#e5d9c5]"></div>
                                                    <h2 className="text-3xl font-serif font-bold text-karnak-red">SFIZIOSITÀ</h2>
                                                    <div className="flex-1 h-px bg-[#e5d9c5]"></div>
                                                </div>
                                                <div className="flex flex-col gap-2">
                                                    {data.sfiziosita.map((item, idx) => (
                                                        <MenuItem key={idx} {...item} />
                                                    ))}
                                                </div>
                                            </div>

                                        </div>

                                        <PizzaDivider imageUrl="https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?q=80&w=1200&auto=format&fit=crop" />
                                    </>
                                )}

                            </div>
                        </div>

                        {/* Visual Decorative Pizza Image at the bottom */}
                        {!isSearching && (
                            <div className="mt-16 text-center animate-fade-in">
                                <div className="inline-block relative rounded-full p-2 bg-white shadow-xl">
                                    <img 
                                        src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?q=80&w=800&auto=format&fit=crop" 
                                        alt="Delicious Margherita Pizza" 
                                        className="w-64 h-64 md:w-96 md:h-96 object-cover rounded-full shadow-inner border-4 border-[#fdfbf7]"
                                    />
                                    <div className="absolute -bottom-4 right-0 bg-karnak-red text-white p-4 rounded-full shadow-lg">
                                        <Icons.Leaf />
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="mt-20 bg-karnak-dark text-[#e5d9c5] py-12 text-center border-t-8 border-karnak-red">
                        <div className="max-w-4xl mx-auto px-4">
                            <h2 className="font-serif text-4xl text-white mb-2">Pizzeria Karnak</h2>
                            <p className="font-serif italic mb-8">Grazie per aver scelto Pizzeria Karnak - Buon Appetito! 🇮🇹</p>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-sm font-sans mb-8">
                                <div className="bg-white/5 p-4 rounded-xl">
                                    <h4 className="font-bold text-white mb-2 uppercase">Bevande & Birre</h4>
                                    <p>Tutte le bibite: 1.00€</p>
                                    <p>Birre: da 1.50€ a 3.00€</p>
                                </div>
                                <div className="bg-white/5 p-4 rounded-xl border border-karnak-gold/20">
                                    <h4 className="font-bold text-karnak-gold mb-2 uppercase">Consegna a Domicilio</h4>
                                    <p className="text-lg text-white font-bold mb-1">1.50€</p>
                                    <p className="text-xs opacity-80">(Ordine minimo 10.00€)</p>
                                </div>
                                <div className="bg-white/5 p-4 rounded-xl">
                                    <h4 className="font-bold text-white mb-2 uppercase">Accettiamo</h4>
                                    <p>VISA, MasterCard, Maestro</p>
                                    <p>Pago BANCOMAT</p>
                                </div>
                            </div>
                            
                            <p className="text-xs opacity-50">© 2026 Pizzeria Karnak. Tutti i diritti riservati.</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
